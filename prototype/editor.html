<!doctype html>
<!-- Three throwaway visual directions for Apollo's editor, selected with ?variant=. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo editor — visual prototype</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#242733} button{font:inherit;cursor:pointer} button:focus-visible,a:focus-visible{outline:3px solid #6386dc;outline-offset:3px} .app{height:100vh;overflow:hidden} .top{height:64px;display:flex;align-items:center;padding:0 24px;gap:18px} .logo{font-weight:750;letter-spacing:-.06em;font-size:22px} .logo span{color:#7a83af} .divider{width:1px;height:25px;background:currentColor;opacity:.13} .title{font-weight:650;font-size:14px} .sub{font-size:11px;color:#888f9c;margin-top:4px} .spacer{flex:1} .top button,.tool{border:0;background:transparent;color:inherit;padding:8px 10px;border-radius:7px} .top button:hover,.tool:hover{background:#7b84901a} .primary{background:#292e3e!important;color:#fff!important;padding:10px 16px!important;font-weight:600;font-size:12px} .saved{font-size:12px;color:#7a8590;white-space:nowrap} .saved:before{content:'●';color:#6eaa89;margin-right:7px;font-size:9px} .body{height:calc(100vh - 64px);display:flex;min-height:0} .sidebar{width:238px;flex:none;overflow:auto;padding:26px 16px} .section-label{display:flex;align-items:center;justify-content:space-between;color:#949aa6;font-size:11px;font-weight:650;letter-spacing:.04em;margin:12px 8px 14px} .nav-item{display:flex;gap:11px;align-items:center;border-radius:8px;padding:10px;color:#727a89;font-size:13px} .nav-item.active{color:#424f79;background:#e5e8f2;font-weight:650} .nav-icon{width:16px;text-align:center;color:#929ab2} .scene{font-size:11px;color:#737c8c;line-height:1.5;padding:9px 10px 9px 18px;border-left:1px solid #d5d9e3;margin-left:15px} .scene.current{color:#313c5a;border-left:2px solid #7885b2;font-weight:650} .scene small{display:block;color:#9ba2ad;font-size:10px;font-weight:400} .workspace{min-width:0;flex:1;overflow:auto;position:relative} .workbar{height:54px;display:flex;align-items:center;padding:0 32px;gap:10px;font-size:12px;color:#838b98} .workbar strong{color:#49515f;font-size:12px} .paper{width:612px;min-height:792px;max-width:calc(100% - 32px);background:#fff;color:#202124;margin:18px auto 100px;padding:71px 70px 80px 92px;box-shadow:0 8px 36px #222d3e18,0 1px 3px #222d3e18;font:12px/1.4 "Courier New",monospace;position:relative} .pagenum{position:absolute;right:67px;top:38px} .script p{margin:0 0 13px;white-space:normal} .script .heading{text-transform:uppercase;margin:23px 0 13px} .script .character{margin:13px 0 0 180px;white-space:nowrap} .script .dialogue{margin:0 0 13px 108px;width:252px;max-width:calc(100% - 108px)} .script .paren{margin:0 0 0 137px} .script .transition{text-align:right;margin-top:22px} .script .cursor{border-left:2px solid #6981c5;margin-left:2px} .footer-note{color:#a2a8b0;font-size:11px;margin-left:10px} .bottom-switch{position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#20232d;color:white;border:1px solid #ffffff28;border-radius:12px;padding:6px;box-shadow:0 8px 30px #0003;font-size:12px;white-space:nowrap} .bottom-switch button{border:0;color:inherit;background:#ffffff18;border-radius:7px;width:34px;height:32px;font-size:18px} .bottom-switch button:hover{background:#ffffff33} .switch-label{min-width:180px;text-align:center}.switch-label small{display:block;color:#aeb6c4;font-size:9px;margin-top:2px}.mock-label{font-size:10px;color:#99a2ae}
  /* A: a quiet library with persistent navigation. */
  .a{background:#f1f3f7}.a .top{background:#f9fafc;border-bottom:1px solid #e3e6ed}.a .sidebar{background:#f8f9fb;border-right:1px solid #e3e6ed}.a .workbar{border-bottom:1px solid #e5e8ee}.a .paper{margin-top:30px}
  /* B: a focused writing desk with context in a compact rail. */
  .b{background:#d8dce2}.b .top{background:#323842;color:#eff1f3;height:58px;padding:0 28px}.b .body{height:calc(100vh - 58px)}.b .top .sub,.b .saved{color:#aeb7c0}.b .primary{background:#e9edf0!important;color:#303843!important}.b .sidebar{width:74px;background:#3c434d;display:flex;align-items:center;flex-direction:column;padding:24px 0;gap:12px}.b .rail-icon{border:0;background:transparent;color:#b7c0c8;border-radius:11px;width:44px;height:44px;font-size:18px}.b .rail-icon.selected{background:#637080;color:white}.b .workspace{background:#d4d9df}.b .workbar{justify-content:center;height:57px;color:#78818a}.b .workbar strong{color:#4d5965}.b .paper{margin-top:12px;box-shadow:0 14px 40px #202d3d26}.b .desk-caption{position:absolute;right:30px;top:72px;color:#77828c;font-size:11px;line-height:1.7;text-align:right}
  .b .outline{width:280px;flex:none;background:#f5f4f1;border-right:1px solid #c9cdd2;padding:25px 18px;overflow:auto}.b .outline[hidden]{display:none}.b .outline-head{display:flex;align-items:center;justify-content:space-between;margin:0 6px 23px}.b .outline-head strong{font-size:16px;letter-spacing:-.03em}.b .outline-head button{border:0;background:transparent;color:#7f8587;font-size:20px}.b .outline-meta{margin:0 6px 24px;color:#929795;font-size:11px}.b .outline-label{margin:0 6px 10px;color:#929795;font-size:11px;font-weight:650}.b .outline-scene{padding:13px 12px;border-radius:8px;color:#69706d;font-size:11px;line-height:1.45}.b .outline-scene strong{display:block}.b .outline-scene small{display:block;color:#a1a5a0;font-size:11px;margin-top:5px}.b .outline-scene.current{background:white;color:#3a4651;box-shadow:0 2px 9px #3531260c}.b .rail-icon[aria-expanded="true"]{background:#637080;color:white}
  /* C: an outline-led studio with the page anchored beside the scene list. */
  .c{background:#f9f8f5}.c .top{background:#fff;border-bottom:1px solid #e9e6df}.c .logo span{color:#b58b68}.c .body{background:#fbfaf7}.c .sidebar{width:300px;background:#f6f4ef;border-right:1px solid #e5e1d9;padding:28px 22px}.c .project-name{font-size:21px;letter-spacing:-.04em;font-weight:700;margin:4px 8px}.c .project-meta{font-size:11px;color:#98968f;margin:7px 8px 28px}.c .scene-card{padding:15px 14px;margin:5px 0;border-radius:8px;font-size:12px;line-height:1.5;color:#6e716e}.c .scene-card.selected{background:#fff;box-shadow:0 2px 9px #3531260c;color:#363d39}.c .scene-card strong{display:block;font-size:11px;letter-spacing:.02em}.c .scene-card small{display:block;margin-top:6px;font-size:11px;color:#aaa99f}.c .workspace{background:#fff}.c .workbar{height:68px;border-bottom:1px solid #eeeae3;padding:0 40px}.c .paper{box-shadow:none;margin:18px auto 100px}.c .paper:before{content:' ';position:absolute;top:0;left:0;right:0;height:1px;background:#efede8}.c .primary{background:#55695f!important}.c .chapter{font-size:10px;color:#a09d94;margin-right:4px}
  @media(max-width:850px){.a .sidebar{width:190px}.c .sidebar{width:220px}.desk-caption{display:none}.top{padding:0 14px;gap:10px}.top .saved{display:none}.paper{padding-left:60px;padding-right:42px}.script .character{margin-left:140px}.script .dialogue{margin-left:80px;max-width:calc(100% - 80px)}.script .paren{margin-left:105px}}
  @media(max-width:600px){.a .sidebar,.c .sidebar{display:none}.b .sidebar{width:52px}.b .rail-icon{width:38px}.top .optional,.footer-note{display:none}.paper{padding:60px 25px;min-height:700px;font-size:11px}.script .character{margin-left:35%}.script .dialogue{margin-left:20%;max-width:80%}.script .paren{margin-left:27%}.workbar{padding:0 15px!important}.bottom-switch{bottom:10px}}
</style>
</head>
<body>
<main id="app"></main>
<div class="bottom-switch" aria-label="Prototype directions">
  <button id="previous" aria-label="Previous direction">‹</button>
  <div class="switch-label" aria-live="polite"><span id="variant-name"></span><small>Visual prototype · use ← → to compare</small></div>
  <button id="next" aria-label="Next direction">›</button>
</div>
<script>
const script = `<div class="script"><p class="heading">INT. RADIO STATION — NIGHT</p><p>The ON AIR light hums above an empty hallway. Rain needles the windows at the far end.</p><p>MARA, still in her coat, holds a cassette against the glass of the studio door.</p><p class="character">MARA</p><p class="dialogue">You said you'd be here before the last song.</p><p>A voice answers through the headphones, soft beneath the static.</p><p class="character">ELI (V.O.)</p><p class="dialogue">I am here. Just not where you expected.</p><p>Mara looks toward the blinking light on the console. She presses play.</p><p class="character">MARA</p><p class="paren">(into the microphone)</p><p class="dialogue">Then let's start again.<span class="cursor"></span></p><p class="heading">EXT. CITY STREET — NIGHT</p><p>A single window glows above the sleeping storefronts.</p><p class="transition">CUT TO:</p></div>`;
const paper = `<article class="paper" aria-label="Sample screenplay page"><div class="pagenum">12.</div>${script}</article>`;
const header = `<div class="logo">ap<span>o</span>llo</div><div class="divider"></div><div><div class="title">The Last Broadcast</div><div class="sub">First draft</div></div><div class="spacer"></div><span class="saved">Saved just now</span><button class="optional" type="button">History</button><button class="primary" type="button">Export</button>`;
const sceneList = `<div class="scene">INT. APARTMENT — EVENING<small>Scene 8</small></div><div class="scene">EXT. CITY STREET — NIGHT<small>Scene 9</small></div><div class="scene current">INT. RADIO STATION — NIGHT<small>Scene 10 · page 12</small></div><div class="scene">EXT. CITY STREET — NIGHT<small>Scene 11</small></div><div class="scene">INT. STUDIO — LATER<small>Scene 12</small></div>`;
const outline = `<div class="outline-head"><strong>Scenes</strong><button type="button" data-outline-toggle aria-label="Close scene outline">×</button></div><div class="outline-meta">The Last Broadcast · First draft</div><div class="outline-label">28 scenes</div><div class="outline-scene"><strong>8 &nbsp; INT. APARTMENT — EVENING</strong><small>Mara finds the tape</small></div><div class="outline-scene"><strong>9 &nbsp; EXT. CITY STREET — NIGHT</strong><small>On the way to the station</small></div><div class="outline-scene current"><strong>10 &nbsp; INT. RADIO STATION — NIGHT</strong><small>Mara hears Eli's voice · p. 12</small></div><div class="outline-scene"><strong>11 &nbsp; EXT. CITY STREET — NIGHT</strong><small>The city listens</small></div><div class="outline-scene"><strong>12 &nbsp; INT. STUDIO — LATER</strong><small>The last broadcast</small></div>`;
const variants = {
  a:{name:'Library', render:()=>`<div class="app a"><header class="top">${header}</header><div class="body"><aside class="sidebar"><div class="section-label">WORKSPACE <span>⌘</span></div><div class="nav-item active"><span class="nav-icon">▤</span> Screenplay</div><div class="nav-item"><span class="nav-icon">▧</span> Notes</div><div class="nav-item"><span class="nav-icon">◇</span> Stash</div><div class="section-label" style="margin-top:32px">SCENES <span>⌄</span></div>${sceneList}</aside><section class="workspace"><div class="workbar"><strong>Screenplay</strong><span> / </span><span>Scene 10</span><div class="spacer"></div><button class="tool" type="button">− &nbsp; 100% &nbsp; +</button><button class="tool" type="button">⋯</button></div>${paper}</section></div></div>`},
  b:{name:'Writing desk', render:()=>`<div class="app b"><header class="top">${header}</header><div class="body"><aside class="sidebar" aria-label="Workspace"><button class="rail-icon selected" type="button" aria-label="Screenplay">▤</button><button class="rail-icon" type="button" aria-label="Toggle scene outline" aria-controls="scene-outline" aria-expanded="false" data-outline-toggle>☰</button><button class="rail-icon" type="button" aria-label="Notes">▧</button><button class="rail-icon" type="button" aria-label="Stash">◇</button></aside><aside class="outline" id="scene-outline" aria-label="Scene outline" hidden>${outline}</aside><section class="workspace"><div class="workbar"><span>‹</span><strong>Scene 10</strong><span>of 28</span><span>›</span><span class="footer-note">INT. RADIO STATION — NIGHT</span></div><div class="desk-caption">Page 12 of 94<br>100% zoom</div>${paper}</section></div></div>`},
  c:{name:'Story outline', render:()=>`<div class="app c"><header class="top">${header}</header><div class="body"><aside class="sidebar"><div class="project-name">The Last Broadcast</div><div class="project-meta">First draft · 94 pages</div><div class="section-label">SCENES <span>⌄</span></div><div class="scene-card"><strong>8 &nbsp; INT. APARTMENT — EVENING</strong><small>Mara finds the tape</small></div><div class="scene-card"><strong>9 &nbsp; EXT. CITY STREET — NIGHT</strong><small>On the way to the station</small></div><div class="scene-card selected"><strong>10 &nbsp; INT. RADIO STATION — NIGHT</strong><small>Mara hears Eli's voice · p. 12</small></div><div class="scene-card"><strong>11 &nbsp; EXT. CITY STREET — NIGHT</strong><small>The city listens</small></div><div class="scene-card"><strong>12 &nbsp; INT. STUDIO — LATER</strong><small>The last broadcast</small></div><div class="section-label" style="margin-top:30px">PROJECT</div><div class="nav-item"><span class="nav-icon">▧</span> Notes</div><div class="nav-item"><span class="nav-icon">◇</span> Stash</div></aside><section class="workspace"><div class="workbar"><span class="chapter">10</span><strong>INT. RADIO STATION — NIGHT</strong><div class="spacer"></div><span>Page 12</span><button class="tool" type="button">⋯</button></div>${paper}</section></div></div>`}
};
const keys = Object.keys(variants); let current = new URLSearchParams(location.search).get('variant'); if(!keys.includes(current)) current='b';
function show(key, update=true){current=key;document.getElementById('app').innerHTML=variants[key].render();document.getElementById('variant-name').textContent=`${key.toUpperCase()} · ${variants[key].name}`;if(update){const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url)}}
function move(step){show(keys[(keys.indexOf(current)+step+keys.length)%keys.length])}
document.getElementById('previous').addEventListener('click',()=>move(-1));document.getElementById('next').addEventListener('click',()=>move(1));document.getElementById('app').addEventListener('click',e=>{if(!e.target.closest('[data-outline-toggle]'))return;const panel=document.getElementById('scene-outline');panel.hidden=!panel.hidden;document.querySelector('[aria-controls="scene-outline"]').setAttribute('aria-expanded',String(!panel.hidden))});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable="true"]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('popstate',()=>{const key=new URLSearchParams(location.search).get('variant');show(keys.includes(key)?key:'b',false)});show(current,false);
</script>
</body>
</html>
